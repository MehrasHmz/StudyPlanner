name: Build, Test and Docker
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyplanner_test
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyplanner_test -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      STUDYPLANNER_TEST_POSTGRES: Host=localhost;Port=5432;Username=studyplanner_test;Password=ci-disposable-only;Database=postgres
      POSTGRES_USER: studyplanner
      POSTGRES_PASSWORD: ci-compose-disposable-only
      POSTGRES_DB: StudyPlannerCI
      ASPNETCORE_ENVIRONMENT: Production
      APP_PORT: "8080"
      COMPOSE_PROJECT_NAME: studyplanner-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Restore with vulnerability auditing
        run: dotnet restore StudyPlanner.sln -p:NuGetAudit=true -p:NuGetAuditMode=all '-warnaserror:NU1901;NU1902;NU1903;NU1904'
      - name: Release build
        run: dotnet build StudyPlanner.sln -c Release --no-restore
      - name: .NET and real PostgreSQL tests
        run: dotnet test StudyPlanner.sln -c Release --no-build --no-restore --logger "trx;LogFileName=ci.trx" --results-directory TestResults
      - name: Timer unit tests
        run: node --test tests/frontend/focus-timer.test.cjs
      - name: Docker build and startup verification
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up --build -d --wait --wait-timeout 180 postgres
          docker compose run --rm --no-deps migrate
          docker compose run --rm --no-deps api --disable-demo-account --user-id 00000000-0000-0000-0000-000000000001 --operator ci-disposable-operator --reason disposable-release-verification --confirm
          docker compose up --build -d --wait --wait-timeout 180
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/health/ready
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/Auth/Login
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14
